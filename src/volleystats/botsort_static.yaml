# BoT-SORT tuned for a fixed tripod camera with players who occlude each other at the net.
tracker_type: botsort
track_high_thresh: 0.25
track_low_thresh: 0.1
new_track_thresh: 0.4
track_buffer: 90 # keep a lost player for 3 s at 30 fps
match_thresh: 0.8
fuse_score: True
gmc_method: none # the camera does not move
proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: True
model: auto
