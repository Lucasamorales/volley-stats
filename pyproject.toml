[project]
name = "volleystats"
version = "0.1.0"
description = "Per-player volleyball statistics from amateur tripod video"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Model stack. Kept optional so the pure-logic stages and tests run without a GPU.
ml = [
    "torch>=2.7",
    "torchvision",
    "ultralytics",
    "opencv-python",
    "onnxruntime",
    "lap>=0.5.13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/volleystats"]

# RTX 50-series (Blackwell, sm_120) needs CUDA 12.8+ builds of PyTorch.
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
